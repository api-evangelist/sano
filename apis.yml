name: Sano
description: >-
  Sano Genetics is a UK-based precision-medicine company operating a 360-degree
  platform that connects the workflows behind decentralized clinical trials and
  research studies. Its services span patient recruitment and outreach, protocol
  and study design, digital prescreening and consent, electronic medical record
  retrieval, at-home DNA testing with genetic counseling, participant engagement
  portals, and biomarker testing programs. The platform helps pharmaceutical
  sponsors and research teams find, engage, and retain the right participants for
  genetically-informed studies. Surfaced as a Seedcamp portfolio company and
  profiled in the API Evangelist network; no public developer API is published
  at this time.
